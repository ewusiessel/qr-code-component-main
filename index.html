<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | QR code component</title>
    <style>
      body {
        background-color: rgb(204, 221, 247);
      }
      .white-card {
        width: 290px;
        height: 450px;
        background-color: white;
        /* learnt something 👇 how to center component */
        margin-top: 200px;
        margin-left: auto;
        margin-right: auto;
      }

      img {
        width: 250px;
        position: absolute;
        margin-top: 20px;
        margin-left: 20px;
      }

      .text {
        position: relative;
        top: 300px;
        margin: 20px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="white-card">
      <img src="./images/image-qr-code.png" alt="" />
      <div class="blue-square-qr">
        <div class="text">
          <p class="first-paragraph">
            Improve your front-end skills by building projects
          </p>
          <p class="second-parapgraph">
            Scan the QR code to visit Frontend Mentor and take your coding
            skills to the next level
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
